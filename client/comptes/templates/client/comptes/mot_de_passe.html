{% extends "client/dashboard_base.html" %}
{% block titre %}Changer de mot de passe{% endblock %}
{% block entete %}Mon profil{% endblock %}

{% block contenu %}
<div class="max-w-xl mx-auto bg-surface border border-line rounded-2xl p-7">
  <h1 class="text-lg font-semibold text-ink mb-5 flex items-center gap-2"><svg class="ico text-muted"><use href="#i-key"/></svg> Changer de mot de passe</h1>
  <form method="post" class="form-c form-grid">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <div class="flex items-center gap-4">
      <button type="submit" class="bg-brand hover:bg-brand-hover text-white font-semibold rounded-lg py-2.5 px-5 text-sm">Mettre à jour</button>
      <a href="{% url 'comptes_client:tableau_de_bord' %}" class="text-sm text-muted hover:text-fg">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
