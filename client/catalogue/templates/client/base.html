<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Marketplace{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .champ-form label { display:block; font-size:.8rem; font-weight:600; color:#475569; margin-bottom:.25rem; }
    .champ-form input, .champ-form select { border:1px solid #cbd5e1; border-radius:.5rem; padding:.4rem .6rem; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{% url 'catalogue:accueil' %}" class="font-bold text-indigo-600 text-lg">Marketplace</a>
      <nav class="flex items-center gap-5 text-sm">
        <a href="{% url 'catalogue:accueil' %}" class="text-slate-600 hover:text-indigo-600">Boutiques</a>
        <a href="{% url 'panier:voir' %}" class="text-slate-700 hover:text-indigo-600 font-medium">
          Panier{% if panier_nb %} <span class="ml-1 bg-indigo-600 text-white text-xs rounded-full px-1.5 py-0.5">{{ panier_nb }}</span>{% endif %}
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    {% if messages %}
      <div class="space-y-2 mb-6">
        {% for message in messages %}
          <div class="rounded-lg px-4 py-3 text-sm {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-emerald-50 text-emerald-700 border border-emerald-200{% endif %}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
