{% comment %}Attend `statut` (valeur) et `libelle` (affichage).{% endcomment %}
<span class="text-xs font-medium px-2 py-1 rounded-full border
  {% if statut == 'approuvee' %}border-emerald-200 bg-emerald-50 text-emerald-700
  {% elif statut == 'en_attente' %}border-amber-200 bg-amber-50 text-amber-700
  {% elif statut == 'rejetee' %}border-red-200 bg-red-50 text-red-600
  {% elif statut == 'suspendue' %}border-orange-200 bg-orange-50 text-orange-700
  {% elif statut == 'bannie' %}border-line bg-slate-100 text-ink
  {% else %}border-line bg-soft text-muted{% endif %}">
  {{ libelle }}
</span>
