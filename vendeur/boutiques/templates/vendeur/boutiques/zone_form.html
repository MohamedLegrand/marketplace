{% extends "vendeur/base.html" %}
{% block titre %}Modifier une zone{% endblock %}
{% block entete %}{{ boutique.nom }} · Zone{% endblock %}

{% block contenu %}
<a href="{% url 'boutiques_vendeur:detail' boutique.pk %}" class="inline-flex items-center gap-1.5 text-sm text-muted hover:text-fg mb-3">
  <svg class="ico"><use href="#i-back"/></svg> Retour à la boutique
</a>

<div class="bg-surface border border-line rounded-2xl p-6 max-w-md">
  <h2 class="text-lg font-semibold text-ink mb-5">Zone : {{ zone.nom }}</h2>
  <form method="post" class="form-v">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="bg-brand hover:bg-brand-hover text-white font-semibold rounded-lg py-2.5 px-5 text-sm">Enregistrer</button>
  </form>
</div>
{% endblock %}
