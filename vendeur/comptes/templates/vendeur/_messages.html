{% if messages %}
  <div class="space-y-2 mb-6">
    {% for message in messages %}
      <div class="flex items-start gap-2.5 rounded-lg border px-4 py-3 text-sm
        {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-700
        {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
        {% else %}border-emerald-200 bg-emerald-50 text-emerald-700{% endif %}">
        <svg class="ico mt-0.5 shrink-0"><use href="{% if message.tags == 'error' %}#i-x{% elif message.tags == 'warning' %}#i-alert{% else %}#i-check{% endif %}"/></svg>
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
