{% extends "vendeur/base.html" %}
{% block titre %}Changer de mot de passe{% endblock %}

{% block contenu %}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
  <h1 class="text-xl font-bold mb-6">Changer de mot de passe</h1>
  <form method="post" class="champ-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2.5 px-5">
      Mettre a jour
    </button>
    <a href="{% url 'comptes_vendeur:tableau_de_bord' %}" class="ml-3 text-sm text-slate-500">Annuler</a>
  </form>
</div>
{% endblock %}
