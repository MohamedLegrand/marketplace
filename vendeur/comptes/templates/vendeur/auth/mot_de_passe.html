{% extends "vendeur/base.html" %}
{% block titre %}Mot de passe{% endblock %}
{% block entete %}Mot de passe{% endblock %}

{% block contenu %}
<div class="bg-surface border border-line rounded-2xl p-6 max-w-xl">
  <h2 class="font-semibold text-ink mb-5 flex items-center gap-2">
    <svg class="ico text-muted"><use href="#i-key"/></svg> Changer de mot de passe
  </h2>
  <form method="post" class="form-v form-grid">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <div class="flex items-center gap-4 pt-1">
      <button type="submit" class="bg-brand hover:bg-brand-hover text-white font-semibold rounded-lg py-2.5 px-5 text-sm">Mettre à jour</button>
      <a href="{% url 'comptes_vendeur:tableau_de_bord' %}" class="text-sm text-muted hover:text-fg">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
