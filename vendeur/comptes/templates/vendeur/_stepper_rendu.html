{% comment %}Rendu du fil d'etapes ; `j` = jalon courant (1..3).{% endcomment %}
<ol class="flex items-center w-full mb-8 text-xs font-medium">
  {% for num in "123" %}
    {% with n=forloop.counter %}
    <li class="flex items-center {% if not forloop.last %}flex-1 after:content-[''] after:flex-1 after:h-px after:bg-slate-300 after:mx-2{% endif %}">
      <span class="flex items-center gap-2">
        <span class="flex items-center justify-center w-6 h-6 rounded-full
          {% if n < j %}bg-emerald-500 text-white{% elif n == j %}bg-indigo-600 text-white{% else %}bg-slate-200 text-slate-500{% endif %}">
          {% if n < j %}&#10003;{% else %}{{ n }}{% endif %}
        </span>
        <span class="{% if n == j %}text-indigo-700{% else %}text-slate-500{% endif %}">
          {% if n == 1 %}Identite{% elif n == 2 %}Forfait{% else %}Vendre{% endif %}
        </span>
      </span>
    </li>
    {% endwith %}
  {% endfor %}
</ol>
