{% comment %}Rendu du fil d'etapes ; `j` = jalon courant (1..3).{% endcomment %}
<ol class="flex items-center w-full mb-8 text-xs font-medium">
  {% for _ in "123" %}
    {% with n=forloop.counter %}
    <li class="flex items-center {% if not forloop.last %}flex-1 after:content-[''] after:flex-1 after:h-px after:mx-3 {% if n < j %}after:bg-brand{% else %}after:bg-line{% endif %}{% endif %}">
      <span class="flex items-center gap-2">
        <span class="flex items-center justify-center w-6 h-6 rounded-full border
          {% if n < j %}bg-brand border-brand text-white
          {% elif n == j %}border-brand text-brand
          {% else %}border-line text-muted{% endif %}">
          {% if n < j %}<svg style="width:13px;height:13px"><use href="#i-check"/></svg>{% else %}{{ n }}{% endif %}
        </span>
        <span class="{% if n == j %}text-ink{% else %}text-muted{% endif %}">
          {% if n == 1 %}Identité{% elif n == 2 %}Forfait{% else %}Vendre{% endif %}
        </span>
      </span>
    </li>
    {% endwith %}
  {% endfor %}
</ol>
